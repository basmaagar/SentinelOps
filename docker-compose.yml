services:
  # --- Application cible instrumentée ---
  target-app:
    build: ./app
    container_name: sentinelops-target-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Volume de logs (Jour 12) : app.log est écrit DANS le conteneur, mais la
    # boucle de supervision tourne sur l'hôte. Sans ce montage, l'Agent Logs
    # ne pourrait jamais lire de vraies lignes -- il resterait alimenté à la
    # main comme dans les tests, et le TTD ne serait pas mesurable.
    volumes:
      - ./logs:/app/logs
    environment:
      # Adresse de la dépendance réelle. Si la variable est absente ou le
      # service injoignable, target-app retombe sur sa simulation locale :
      # les injecteurs et la vérité terrain continuent de fonctionner à
      # l'identique, sans dépendre du nouveau conteneur.
      DEPENDENCY_URL: "http://dependency-service:8000"
    depends_on:
      - dependency-service
    # healthcheck : permet aux injecteurs (Jour 2) de vérifier que l'app est prête
    # avant de déclencher une panne, évitant des faux résultats de test.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Dépendance externe simulée (Jour 14) ---
  #
  # Service RÉEL, et non plus simulé à l'intérieur de target-app. C'est ce
  # qui rend l'action `scale_replica` exécutable : sans conteneur, il n'y
  # avait rien à mettre à l'échelle, et l'implémentation d'origine
  # s'appuyait sur l'API Docker Swarm, absente ici.
  #
  # Trois points volontaires :
  #   - AUCUN port publié : c'est la condition pour que
  #     `docker compose up -d --scale dependency-service=N` fonctionne.
  #     Un port fixe sur l'hôte provoquerait un conflit dès la 2e réplique.
  #     Une dépendance interne n'a de toute façon pas à être exposée.
  #   - AUCUN container_name : Compose refuse de mettre à l'échelle un
  #     service dont le nom de conteneur est figé.
  #   - `deploy.replicas` fixe l'état initial ; l'action de remédiation le
  #     modifie ensuite, et le rollback y revient.
  dependency-service:
    build: ./dependency
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      # Capacité de traitement simultané par réplique.
      #
      # Fixée à 2 après mesure. La latence de base oscille naturellement
      # entre 35 et 85 ms : pour qu'une saturation soit détectable par un
      # z-score, elle doit produire un écart largement supérieur à ce
      # bruit. Avec une capacité de 4 et 12 appels concurrents, la file
      # restait trop courte et la latence montait à peine au-dessus de la
      # variation normale.
      #
      # À 2 par réplique, 20 appels concurrents forment une file de dix
      # profondeurs : la latence dépasse 300 ms, soit un signal net. Et le
      # passage à 2 répliques divise cette file par deux, donc l'effet de
      # la remédiation est lui aussi mesurable.
      DEPENDENCY_CONCURRENCY: "2"

  # --- Landing page (page d'accueil du projet) ---
  #
  # Fichier statique autonome, servi par Nginx. Aucune dépendance avec le
  # reste de la stack : elle peut être arrêtée ou modifiée sans effet sur
  # les autres services. Le seul lien est un bouton qui ouvre le dashboard
  # sur son port publié (8501), depuis le navigateur de l'utilisateur — et
  # non depuis l'intérieur du réseau Docker.
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    container_name: sentinelops-landing
    ports:
      - "80:80"
    restart: unless-stopped

  # --- Console de supervision (dashboard Streamlit) ---
  #
  # Deux montages proviennent d'une contrainte réelle du dashboard :
  #   - les fichiers JSONL du projet sont lus directement depuis le disque,
  #     pas via une API. Chaque dossier producteur (guardrails, injectors,
  #     remediation, evaluation) est donc monté individuellement, plutôt
  #     que tout le projet, pour limiter ce que le conteneur peut voir et
  #     modifier.
  #   - le socket Docker de l'hôte est monté en lecture-écriture : c'est ce
  #     qui permet au bouton "Approuver" de la console d'exécuter
  #     réellement un redémarrage de conteneur sur l'hôte. Sans ce socket,
  #     `docker.from_env()` échouerait à l'intérieur du conteneur.
  dashboard:
    build:
      context: .
      dockerfile: dashboard_ctx/Dockerfile
    container_name: sentinelops-dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    volumes:
      - ./guardrails:/app/guardrails
      - ./injectors:/app/injectors
      - ./remediation:/app/remediation
      - ./evaluation:/app/evaluation
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Le dashboard interroge Prometheus pour la frise temporelle ; à
      # l'intérieur du réseau Docker, il s'adresse au service par son nom,
      # pas par localhost.
      PROMETHEUS_URL: "http://prometheus:9090"
    depends_on:
      - prometheus

  # --- Monitoring : collecte des métriques ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinelops-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - target-app
      - cadvisor
    restart: unless-stopped

  # cAdvisor : métriques infrastructure réelles par conteneur (CPU, RAM, I/O).
  # Nécessaire car prometheus_client (dans l'app) ne voit que ce que le code
  # applicatif expose explicitement, pas la consommation réelle du conteneur.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sentinelops-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  # --- Visualisation ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinelops-grafana
    ports:
      - "3000:3000"
    environment:
      # Identifiants par défaut simplifiés pour un usage local/démo uniquement.
      # A ne jamais faire en production réelle - acceptable ici car le prototype
      # tourne en local, sans exposition réseau externe.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- Inférence LLM locale ---
  ollama:
    image: ollama/ollama:0.3.12
    container_name: sentinelops-ollama
    ports:
      - "11435:11434"
    volumes:
      # Volume nommé : persiste les modèles téléchargés entre les redémarrages
      # du conteneur. Sans cela, il faudrait re-télécharger 2 modèles (~10GB)
      # à chaque `docker compose down`, ce qui casserait le workflow itératif.
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Décommenter si une GPU NVIDIA est disponible sur la machine de développement :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models: